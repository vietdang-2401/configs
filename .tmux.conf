# Cho phép cuộn chuột và click chọn pane/window
set -g mouse on

set -g status off

# Hỗ trợ hiển thị 256 màu và truecolor
set -g default-terminal "tmux-256color"

# Kiểm tra xem pane hiện tại có đang chạy vim/nvim không
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"

# Di chuyển pane bằng Ctrl + hjkl (không cần bấm Prefix)
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Chế độ copy-mode trong tmux cũng điều hướng bằng phím này
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# --- Focus Pane Identification ---
set -g pane-border-lines heavy
set -g pane-border-style "fg=#444b6a"
set -g pane-active-border-style "fg=#7aa2f7,bold"

set -g window-style "bg=#151724"
set -g window-active-style "bg=#24283b"

# Bật chế độ điều khiển kiểu vi trong copy mode
setw -g mode-keys vi

# (Tùy chọn) Bật vi mode cho cả thanh nhập lệnh (status line) của tmux
set -g status-keys vi

# Gán phím v để bắt đầu chọn vùng và y để copy giống hệt Vim
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Cho phép dùng phím C-v để chọn khối hình chữ nhật (Block visual)
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Giảm thời gian chờ phím Esc xuống gần như bằng 0 (ms)
set -s escape-time 0

### config key ctrl u, ctrl d trong tmux thì sẽ chuyển sang chế độ copy cho tôi:
# 2. Điều kiện kiểm tra pane hiện tại có đang chạy vim/neovim hay không
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

# 3. Phím C-u: nếu là Vim thì gửi nguyên phím C-u, nếu là Terminal thường thì vào Copy-mode cuộn lên
bind-key -n C-u if-shell "$is_vim" 'send-keys C-u' 'copy-mode -u'

# 4. Phím C-d: nếu là Vim thì gửi nguyên phím C-d, nếu là Terminal thường thì vào Copy-mode cuộn xuống
bind-key -n C-d if-shell "$is_vim" 'send-keys C-d' 'copy-mode \; send-keys -X halfpage-down'

# 5. Khi đã nằm trong Copy-mode của Tmux, bấm C-u / C-d để tiếp tục cuộn nửa trang
bind-key -T copy-mode-vi C-u send-keys -X halfpage-up
bind-key -T copy-mode-vi C-d send-keys -X halfpage-down

# Đặt layout dạng main-vertical (1 pane to bên trái, các pane phụ xếp dọc bên phải)
set-hook -g session-created 'split-pane -h -l 25%; select-pane -L'

set-option -ga update-environment 'KITTY_LISTEN_ON KITTY_WINDOW_ID'
